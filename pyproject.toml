[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdipl"
version = "0.1.0"
description = "A deterministic compiler that builds programs and small web applications from intent written in English or Spanish."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
server = ["fastapi==0.162.5", "uvicorn==0.54.0"]
dev = ["ruff", "httpx", "fastapi==0.162.5", "uvicorn==0.54.0"]

[project.scripts]
cdipl = "cdipl.__main__:main"

[tool.setuptools.packages.find]
include = ["cdipl*"]

[tool.setuptools.package-data]
cdipl = ["library/*.tsv", "library/*.json", "live_page.html"]

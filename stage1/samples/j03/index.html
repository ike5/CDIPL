<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <style>
    .error { color: #b00020; }
  </style>
  <script src="../../programs/javascript/j03_form_check.js" defer></script>
</head>
<body>
  <h1>Sign up</h1>

  <form id="signup-form" action="/signup" method="post">
    <p>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
      <span id="name-error" class="error" aria-live="polite"></span>
    </p>
    <p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
      <span id="email-error" class="error" aria-live="polite"></span>
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error">
      <span id="password-error" class="error" aria-live="polite"></span>
    </p>
    <button type="submit">Create account</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <script src="../../programs/javascript/j06_countdown.js" defer></script>
</head>
<body>
  <h1>Countdown to 1 January 2030</h1>

  <p id="countdown" data-target="2030-01-01T00:00:00">
    <span data-unit="days">0</span> days
    <span data-unit="hours">0</span> hours
    <span data-unit="minutes">0</span> minutes
    <span data-unit="seconds">0</span> seconds
  </p>

  <p id="countdown-finished" hidden>The date has passed.</p>
</body>
</html>
